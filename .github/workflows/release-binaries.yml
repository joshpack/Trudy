name: release-binaries

# Releases are manual: Actions > release-binaries > Run workflow, or
# `gh workflow run release-binaries.yml --ref <branch>`. A push to main builds every platform
# without publishing, only to keep the compiler caches warm: a release built right after it hits
# the cache for nearly every object, so the Windows jobs take minutes instead of most of an hour.
# Pull requests never start a build.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the binaries as a GitHub release
        type: boolean
        default: true

permissions:
  contents: read

# LLVM release the Linux PGO builds compile with (LLVM's own GitHub release). A profile is written
# by a current clang and an older reader refuses it, so this has to stay at or above whatever
# produced orchid.profdata (23.1.4 since 0.6.1); bump it when a refreshed profile needs a newer
# LLVM.
env:
  PGO_LLVM_VERSION: "23.1.4"

# A newer push cancels the older cache build; a release never cancels or waits for one.
concurrency:
  group: release-binaries-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Every build is named v0.<minor>.<patch>, with -<channel> appended on every channel but stable:
  # its release tag, its version string, and the prefix of its release files. The branch picks
  # minor and channel in .github/version ("0.4" on the stable branch, "0.4-experimental" on the
  # experimental one); the patch counts up from 0 per minor and channel. Pull requests get a
  # -pr<number> channel that is never released. The update checker only offers its own channel.
  name:
    name: Name the build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    outputs:
      channel: ${{ steps.name.outputs.channel }}
      tag: ${{ steps.name.outputs.tag }}
      previous: ${{ steps.name.outputs.previous }}
    steps:
      - name: Check out version file
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/version
          sparse-checkout-cone-mode: false

      - id: name
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          read -r base < .github/version
          minor=${base%%-*}
          suffix=${base#"$minor"}
          [[ $minor =~ ^0\.[0-9]+$ && ( -z $suffix || $suffix =~ ^-[a-z]+$ ) ]] \
            || { echo "::error::.github/version must read 0.<minor> or 0.<minor>-<channel>, not '$base'"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "channel=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "tag=v$minor.0$suffix-pr$PR_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          channel=${suffix#-}
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          # Newest release of this channel, for the changelog; then the highest patch of this minor.
          previous=$(grep -m1 -E "^v[0-9]+\.[0-9]+\.[0-9]+$suffix\$" <<< "$tags" || true)
          last=$(sed -nE "s/^v${minor//./\\.}\.([0-9]+)$suffix\$/\1/p" <<< "$tags" | sort -n | tail -n 1)
          tag="v$minor.$(( ${last:--1} + 1 ))$suffix"
          echo "channel=${channel:-stable}" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Build $tag, previous release of the channel: ${previous:-none}"

      # The repository's caches are capped at 10 GB. Every run saves a fresh object cache per
      # platform, so the total passed 12 GB, GitHub evicted the least recently used entries (the
      # Windows object caches among them) and the MSVC build recompiled a third of the tree. Only
      # the newest cache per key prefix is ever restored, so the older ones go, and so do caches of
      # other branches, which main cannot restore.
      - name: Prune old caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 1000 --json id,key,ref,createdAt --jq '
            map(.prefix = (.key | sub("-?[0-9a-f]{32,64}$"; "")))
            | (map(select(.ref != "refs/heads/main" and .ref != env.GITHUB_REF))
               + (map(select(.ref == "refs/heads/main" or .ref == env.GITHUB_REF))
                  | group_by([.ref, .prefix]) | map(sort_by(.createdAt) | .[:-1]) | add // []))
            | .[] | "\(.id) \(.key)"' |
          while read -r id key; do
            echo "Deleting $key"
            # Another run may have deleted it first.
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  build:
    name: ${{ matrix.platform }} binary
    needs: name
    runs-on: ${{ matrix.runner }}
    # A stalled step otherwise holds the release for GitHub's 6 hour default. The slowest job, the
    # Windows MSVC build without a usable cache, takes about an hour.
    timeout-minutes: 90
    env:
      BUILD_TAG: ${{ needs.name.outputs.tag }}
      ASSET_NAME: trudy-${{ needs.name.outputs.tag }}-${{ matrix.platform }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
          # The -pgo builds are the same programs compiled by clang against the repo's
          # orchid.profdata. Eden's profile (Eden-CI/PGO) comes from Switch 1 games: with it Mario
          # Kart World ran at about half the speed of the normal build, with orchid.profdata at
          # about the same speed. Windows uses MSYS2's MinGW clang like Eden does; MSVC cannot read
          # an LLVM .profdata file.
          - platform: linux-x86_64-pgo
            runner: ubuntu-24.04
            pgo: true
          - platform: windows-x86_64
            runner: windows-2022
          - platform: windows-x86_64-pgo
            runner: windows-2022
            pgo: true
            mingw: true
          # Trudy: Ryzen 9000 builds (-march=znver5), same toolchains and profile as the -pgo ones.
          - platform: windows-x86_64-zen5
            runner: windows-2022
            pgo: true
            mingw: true
            preset: zen5
            lto: true
          - platform: linux-x86_64-zen5
            runner: ubuntu-24.04
            pgo: true
            preset: zen5
            lto: true
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: linux-aarch64-pgo
            runner: ubuntu-24.04-arm
            pgo: true

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # The package downloads sometimes crawl at 20-50 kB/s on a runner, from Azure's Ubuntu mirror
      # and from archive.ubuntu.com alike (the first 0.7.2 run sat here for over 15 minutes, against
      # 45 s normally), while the package lists come in fast. The .deb files (about 120 MB per
      # architecture) therefore come from the Actions cache, and apt only downloads what changed.
      - name: Cache apt packages
        if: startsWith(matrix.platform, 'linux')
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/release-binaries.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        # Each attempt is timed out, and the retries switch to Ubuntu's own archive. Qt comes from
        # install-qt-action (6.8.3), which CMake and linuxdeploy use, so Ubuntu's Qt 6.4 packages
        # are not installed.
        timeout-minutes: 25
        run: |
          set -euo pipefail
          debs="$RUNNER_TEMP/apt-debs"
          mkdir -p "$debs"
          if compgen -G "$debs/*.deb" > /dev/null; then
            sudo cp "$debs"/*.deb /var/cache/apt/archives/
          fi
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          packages=(
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0
            mesa-common-dev nasm ninja-build libavfilter-dev libavcodec-dev
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev
            spirv-tools spirv-headers libusb-1.0-0-dev
            libboost-dev libboost-fiber-dev libboost-context-dev
            libopus-dev libasound2-dev ccache
            libxcb-cursor0 libxcb-icccm4 libxcb-image0
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          )
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' \
                /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2> /dev/null || true
            fi
            if sudo timeout 180 apt-get "${apt_opts[@]}" update &&
               sudo timeout 420 apt-get "${apt_opts[@]}" install -y --no-install-recommends "${packages[@]}"; then
              # Keep exactly the packages of this install for the cache.
              rm -f "$debs"/*.deb
              cp /var/cache/apt/archives/*.deb "$debs"/
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out"
            sleep 15
          done
          exit 1

      - name: Install Qt on Linux x86_64
        if: startsWith(matrix.platform, 'linux') && runner.arch != 'ARM64'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install Qt on Linux ARM64
        if: startsWith(matrix.platform, 'linux') && runner.arch == 'ARM64'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux_arm64
          target: desktop
          arch: linux_gcc_arm64
          modules: qtcharts
          cache: true

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          brew install autoconf automake boost ccache cmake ffmpeg fmt glslang \
            libtool libusb lz4 ninja nlohmann-json openssl@3 pkgconf sdl3 \
            speexdsp zlib zstd

      - name: Install Qt on macOS
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtcharts
          cache: true

      # Ubuntu's own clang 18 cannot read a profile from a current LLVM, so the -pgo builds take
      # clang and lld from LLVM's release on GitHub. apt.llvm.org was tried first and failed both
      # 0.6.1 runs: the runners could not resolve its name, even after retries. Only clang, lld (both
      # statically linked against LLVM) and clang's headers are unpacked, about 500 MB, and they stay
      # in the Actions cache, so later runs download nothing.
      - name: Cache clang for PGO
        if: startsWith(matrix.platform, 'linux') && matrix.pgo
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/llvm
          key: pgo-llvm-${{ env.PGO_LLVM_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install clang for PGO
        if: startsWith(matrix.platform, 'linux') && matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          llvm="$RUNNER_TEMP/llvm"
          if [ ! -x "$llvm/bin/clang" ] || [ ! -x "$llvm/bin/ld.lld" ]; then
            case "$RUNNER_ARCH" in
              X64) arch=X64 ;;
              ARM64) arch=ARM64 ;;
              *) echo "::error::no LLVM release build for runner arch $RUNNER_ARCH"; exit 1 ;;
            esac
            name="LLVM-$PGO_LLVM_VERSION-Linux-$arch"
            url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$PGO_LLVM_VERSION/$name.tar.xz"
            # Into a file first: a retried download piped straight into tar would hand it a broken
            # stream.
            curl -fL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/llvm.tar.xz" "$url"
            rm -rf "$llvm" && mkdir -p "$llvm"
            tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$llvm" --strip-components=1 --wildcards \
              "$name/bin/clang" "$name/bin/clang++" "$name/bin/clang-[0-9]*" \
              "$name/bin/lld" "$name/bin/ld.lld" "$name/lib/clang/*/include/*"
            rm "$RUNNER_TEMP/llvm.tar.xz"
          fi
          echo "PGO_LLVM_ROOT=$llvm" >> "$GITHUB_ENV"
          "$llvm/bin/clang" --version
          "$llvm/bin/ld.lld" --version

      # The profile is in the source tree, where both the Linux and MSYS2 configure steps read it.
      - name: Check PGO profile
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          test -s orchid.profdata

      - name: Set up MSVC
        if: matrix.platform == 'windows-x86_64'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt on Windows
        if: matrix.platform == 'windows-x86_64'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      # MSVC is not something ccache handles well, so that job uses sccache. The other jobs use
      # ccache, which CMake enables through USE_CCACHE (externals/cmake-modules/UseCcache.cmake).
      - name: Install sccache on Windows
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 10 -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK on Windows
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: glslangValidator --version

      # Eden builds its Windows PGO binaries with MSYS2's clang toolchain, so we do the same.
      # Use MSYS2's FFmpeg with dav1d: the bundled MinGW package has no AV1 decoder.
      # repo.msys2.org answered one 0.7.2 test run with HTTP 504, so a failed setup gets one retry.
      - name: Set up MSYS2
        id: msys2
        if: matrix.mingw
        continue-on-error: true
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            ffmpeg:p pkgconf:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      - name: Set up MSYS2 (retry)
        if: matrix.mingw && steps.msys2.outcome == 'failure'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            ffmpeg:p pkgconf:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      - name: Cache CPM downloads
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ runner.arch }}-

      # The sha in the key makes every run save a fresh cache (actions/cache never saves over an
      # exact hit), and restore-keys seeds it from the newest one of the same platform. The "sha-"
      # part ends the platform name: without it "objects-linux-x86_64-" also matched the -pgo
      # job's clang cache, and the gcc build restored that one and recompiled everything.
      - name: Cache compiler objects
        uses: actions/cache@v5
        with:
          path: |
            .ccache
            .sccache
          key: objects-${{ matrix.platform }}-sha-${{ github.sha }}
          restore-keys: |
            objects-${{ matrix.platform }}-sha-

      - name: Configure Linux
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          flags=(
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=OFF
            -DYUZU_TESTS=OFF
            -DYUZU_CMD=ON
            -DYUZU_ROOM=OFF
            -DYUZU_ROOM_STANDALONE=OFF
            -DYUZU_USE_BUNDLED_QT=OFF
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
            -DYUZU_USE_BUNDLED_SDL3=ON
            -DVulkanHeaders_FORCE_BUNDLED=ON
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
            -DENABLE_UPDATE_CHECKER=ON
            "-DORCHID_UPDATE_REPO=$GITHUB_REPOSITORY"
            "-DORCHID_BUILD_TAG=$BUILD_TAG"
            "-DORCHID_BUILD_PLATFORM=${{ matrix.platform }}"
            -DUSE_DISCORD_PRESENCE=OFF
            -DUSE_CCACHE=ON
            "-DYUZU_BUILD_PRESET=${{ matrix.preset || 'custom' }}"
            "-DENABLE_LTO=${{ matrix.lto && 'ON' || 'OFF' }}"
          )
          if [ '${{ matrix.pgo }}' = 'true' ]; then
            # Same flags Eden's CI passes for its clang PGO build.
            profile="-fprofile-use=$PWD/orchid.profdata -Wno-backend-plugin \
              -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
            flags+=(
              "-DCMAKE_C_COMPILER=$PGO_LLVM_ROOT/bin/clang"
              "-DCMAKE_CXX_COMPILER=$PGO_LLVM_ROOT/bin/clang++"
              "-DCMAKE_EXE_LINKER_FLAGS=-B$PGO_LLVM_ROOT/bin -fuse-ld=lld"
              "-DCMAKE_C_FLAGS=$profile"
              "-DCMAKE_CXX_FLAGS=$profile"
            )
          fi
          cmake -S . -B build/release -G Ninja "${flags[@]}"

      - name: Configure macOS ARM
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR;$(brew --prefix)"
          "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"
          -DYUZU_USE_BUNDLED_SDL3=OFF
          -DYUZU_USE_BUNDLED_MOLTENVK=ON
          -DVulkanHeaders_FORCE_BUNDLED=ON
          -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
          -DENABLE_UPDATE_CHECKER=ON
          "-DORCHID_UPDATE_REPO=$GITHUB_REPOSITORY"
          "-DORCHID_BUILD_TAG=$BUILD_TAG"
          "-DORCHID_BUILD_PLATFORM=${{ matrix.platform }}"
          -DUSE_DISCORD_PRESENCE=OFF
          -DUSE_CCACHE=ON

      - name: Configure Windows
        if: matrix.platform == 'windows-x86_64'
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=ON
          "-DORCHID_UPDATE_REPO=$GITHUB_REPOSITORY"
          "-DORCHID_BUILD_TAG=$BUILD_TAG"
          "-DORCHID_BUILD_PLATFORM=${{ matrix.platform }}"
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      # MinGW build: system Qt and libraries from MSYS2, clang plus the repo's PGO profile. The profile
      # path is converted to its Windows form because clang runs with the MSYS mount underneath.
      - name: Configure MinGW PGO
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          set -euo pipefail
          profile="-fprofile-use=$(cygpath -m "$PWD/orchid.profdata") -Wno-backend-plugin \
            -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=OFF \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            "-DORCHID_UPDATE_REPO=$GITHUB_REPOSITORY" \
            "-DORCHID_BUILD_TAG=$BUILD_TAG" \
            "-DORCHID_BUILD_PLATFORM=${{ matrix.platform }}" \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            "-DYUZU_BUILD_PRESET=${{ matrix.preset || 'custom' }}" \
            "-DENABLE_LTO=${{ matrix.lto && 'ON' || 'OFF' }}" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"

      - name: Verify MinGW AV1 decoder
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          set -euo pipefail
          probe_dir="$(cygpath -u "$RUNNER_TEMP")/trudy-ffmpeg-probe"
          mkdir -p "$probe_dir"
          clang tools/ci/ffmpeg_av1_probe.c -o "$probe_dir/ffmpeg-av1-probe.exe" \
            $(pkg-config --cflags --libs libavcodec libavutil)
          "$probe_dir/ffmpeg-av1-probe.exe"

      - name: Build
        if: ${{ ! matrix.mingw && runner.os != 'macOS' }}
        shell: bash
        run: |
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          if command -v ccache > /dev/null; then ccache --show-stats; else sccache --show-stats; fi

      - name: Build macOS ARM
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake --build build/release --target yuzu yuzu-cmd --parallel 2 -- -k 0
          ccache --show-stats

      - name: Package and verify macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          sh tools/macos/package.sh build/release "$ASSET_NAME.zip"

      - name: Build MinGW PGO
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats

      - name: Stage third-party license notices
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p build/release/bin/licenses
          cp -R dist/licenses/. build/release/bin/licenses/
          cp LICENSE.txt build/release/bin/licenses/ffmpeg/COPYING.GPLv3

      - name: Package Linux tar.gz
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/trudy
          test -x build/release/bin/eden-cli
          strip build/release/bin/trudy build/release/bin/eden-cli
          tar -czf "$ASSET_NAME.tar.gz" -C build/release/bin trudy eden-cli licenses
          test -s "$ASSET_NAME.tar.gz"

      # A self-contained AppImage: linuxdeploy bundles every library the two programs need except
      # the base system ones (glibc, X11/Wayland client libraries, the GPU driver and Vulkan loader),
      # and its Qt plugin adds the Qt libraries and platform plugins. Runs on glibc 2.39+ systems.
      - name: Package Linux AppImage
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/trudy
          test -x build/release/bin/eden-cli
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          arch=$(uname -m)
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage"
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage"
          chmod +x "$tools"/*.AppImage
          # The desktop file names its icon dev.trudy.trudy.
          icon="$RUNNER_TEMP/dev.trudy.trudy.png"
          cp dist/Trudy.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LDAI_OUTPUT="$ASSET_NAME.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="$arch"
          mkdir -p AppDir/usr/share/licenses/trudy
          cp -R dist/licenses/. AppDir/usr/share/licenses/trudy/
          "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable build/release/bin/trudy \
            --executable build/release/bin/eden-cli \
            --desktop-file dist/dev.eden_emu.eden.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage
          test -s "$LDAI_OUTPUT"
          ls -la "$LDAI_OUTPUT"

      - name: Package Windows binary
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          foreach ($exe in 'trudy.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
          }
          windeployqt --release --no-translations build/release/bin/trudy.exe

      # A dynamic MinGW build is not portable on its own: windeployqt6 brings the Qt libraries and
      # plugins, then every non-system DLL the binaries and those plugins pull in gets copied next to
      # them (docs/Caveats.md#msys2).
      - name: Package MinGW binary
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f trudy.exe
          test -f eden-cli.exe
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler trudy.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              # The system DLLs ship with Windows, so they never need bundling.
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          for exe in trudy.exe eden-cli.exe; do
            deps "$exe"
          done
          find . -name '*.dll' | while read -r dll; do
            deps "$dll"
          done

      # The artifact is the bin folder itself: GitHub zips artifacts on download, and uploading a
      # zip gave a zip inside a zip. The release job zips it once for the release.
      - name: Upload Windows binary
        if: matrix.platform == 'windows-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

      - name: Upload MinGW binary
        if: matrix.mingw
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

      # Both Linux files go in one artifact: the tar.gz and the AppImage.
      - name: Upload Linux binary
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: |
            ${{ env.ASSET_NAME }}.tar.gz
            ${{ env.ASSET_NAME }}.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload macOS binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save macOS compiler cache after failure
        if: failure() && runner.os == 'macOS'
        uses: actions/cache/save@v5
        with:
          path: |
            .ccache
            .sccache
          key: objects-${{ matrix.platform }}-sha-${{ github.sha }}

  # Publishes every binary as a GitHub release (a pre-release outside stable) once every platform
  # built: on pushes to nx2 and nx2-experimental, and on manual runs unless "Publish the binaries as
  # a GitHub release" is unticked.
  release:
    name: Publish release
    needs: [name, build]
    if: inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only the channel's changelog (.github/release-notes/<channel>.md).
      - name: Check out release notes
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/release-notes
          path: source

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: trudy-${{ needs.name.outputs.tag }}-*
          path: artifacts

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          for artifact in artifacts/*/; do
            name=$(basename "$artifact")
            if compgen -G "$artifact*.AppImage" > /dev/null; then
              cp "$artifact"/*.AppImage "$artifact"/*.tar.gz dist/
            elif compgen -G "$artifact*.zip" > /dev/null; then
              cp "$artifact"/*.zip dist/
            else
              (cd "$artifact" && zip -qr "${GITHUB_WORKSPACE}/dist/${name}.zip" .)
            fi
          done

      # The notes list the commits since the channel's previous release; the app shows users the
      # commits since their own build.
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.name.outputs.channel }}
          BUILD_TAG: ${{ needs.name.outputs.tag }}
          previous: ${{ needs.name.outputs.previous }}
        run: |
          set -euo pipefail
          ls -la dist
          # A channel can carry a changelog, shown first. The title is the bare version:
          # v0.4.1-experimental becomes "0.4.1 experimental".
          channel_notes="source/.github/release-notes/$CHANNEL.md"
          title="${BUILD_TAG#v}"
          title="${title/-/ }"
          # Stable builds are regular releases, so GitHub marks the newest one Latest.
          prerelease=--prerelease
          [ "$CHANNEL" = stable ] && prerelease=
          {
            if [ -f "$channel_notes" ]; then
              cat "$channel_notes"
              echo
              echo "---"
              echo
            fi
            if [ -n "$previous" ]; then
              echo "## Changes since $previous"
              echo
              gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" \
                --jq '.commits | reverse | .[] | "- \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"'
              echo
            fi
            cat <<'EOF'
          ## Install

          Windows: extract the zip and run trudy.exe, or eden-cli.exe from a terminal.
          Linux (AppImage): make it executable (chmod +x) and run it; it bundles its libraries and needs glibc 2.39 or newer (Ubuntu 24.04, Fedora 40, Debian 13, Arch).
          Linux (tar.gz): extract it and run ./trudy or ./eden-cli; it uses your system libraries, so Qt 6 and the usual libraries must be installed.
          macOS: Apple Silicon and macOS 15 or newer. Extract the zip and move trudy.app to Applications. The CLI is inside trudy.app/Contents/MacOS/eden-cli. The app bundles Qt and MoltenVK and is ad-hoc signed, not notarized; macOS may require approval in Privacy & Security. macOS support remains experimental and uses the JIT, not NCE.
          The -pgo builds are the same programs compiled with profile-guided optimization (clang plus the repo's orchid.profdata) and run on the same CPUs; if one is slower than the normal build for you, please report it. The Windows PGO build is a MinGW build, so it carries its own DLLs and needs no Visual C++ redistributable.

          Trudy looks for newer builds of its channel at startup and from Help > Check for Updates.
          EOF
          } > notes.md
          gh release create "$BUILD_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            $prerelease \
            --title "$title" \
            --notes-file notes.md

  # Starts the next release: an issue lists what other Eglantine forks committed since the
  # previous release and this branch lacks (tools/fork-scan.sh, routine in docs/ForkScan.md).
  fork-scan:
    name: Scan other forks
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Open the fork scan issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(git tag --merged HEAD --sort=-creatordate --list 'v*' | head -1)
          tools/fork-scan.sh > scan.md
          # Issue bodies hold 65536 characters.
          head -c 60000 scan.md > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Fork scan after $tag" \
            --label fork-scan --body-file body.md
