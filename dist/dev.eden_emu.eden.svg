<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14525a"/>
      <stop offset="1" stop-color="#0a2229"/>
    </linearGradient>
    <radialGradient id="petal" cx="0.5" cy="0.75" r="0.85">
      <stop offset="0" stop-color="#f48cc4"/>
      <stop offset="0.45" stop-color="#fbd3e8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </radialGradient>
    <radialGradient id="sepal" cx="0.5" cy="0.9" r="0.9">
      <stop offset="0" stop-color="#ef7bb8"/>
      <stop offset="0.5" stop-color="#f9c6e1"/>
      <stop offset="1" stop-color="#fff7fb"/>
    </radialGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d1287f"/>
      <stop offset="1" stop-color="#7d0f4c"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fc27a"/>
      <stop offset="1" stop-color="#1f7a45"/>
    </linearGradient>
    <g id="flower">
      <!-- sepals -->
      <ellipse cx="0" cy="-40" rx="17" ry="34" fill="url(#sepal)" stroke="#5a0c38" stroke-width="3"/>
      <ellipse cx="0" cy="-40" rx="17" ry="34" transform="rotate(125)" fill="url(#sepal)" stroke="#5a0c38" stroke-width="3"/>
      <ellipse cx="0" cy="-40" rx="17" ry="34" transform="rotate(-125)" fill="url(#sepal)" stroke="#5a0c38" stroke-width="3"/>
      <!-- petals -->
      <ellipse cx="-33" cy="-6" rx="34" ry="29" transform="rotate(-18 -33 -6)" fill="url(#petal)" stroke="#5a0c38" stroke-width="3"/>
      <ellipse cx="33" cy="-6" rx="34" ry="29" transform="rotate(18 33 -6)" fill="url(#petal)" stroke="#5a0c38" stroke-width="3"/>
      <!-- veins -->
      <path d="M-12 -4 Q-34 -14 -56 -14 M-12 0 Q-36 2 -58 4 M12 -4 Q34 -14 56 -14 M12 0 Q36 2 58 4"
            fill="none" stroke="#e05aa2" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <!-- lip -->
      <path d="M-15 6 C-26 22 -20 42 0 46 C20 42 26 22 15 6 C8 14 -8 14 -15 6 Z"
            fill="url(#lip)" stroke="#4a0830" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-14 6 C-22 -2 -18 -10 -10 -8 M14 6 C22 -2 18 -10 10 -8"
            fill="none" stroke="#7d0f4c" stroke-width="4" stroke-linecap="round"/>
      <!-- column -->
      <ellipse cx="0" cy="0" rx="9" ry="11" fill="#fff8e6" stroke="#4a0830" stroke-width="2.5"/>
      <circle cx="0" cy="3" r="5" fill="#ffc83d"/>
      <circle cx="-4" cy="20" r="2.2" fill="#ffd86b"/>
      <circle cx="4" cy="24" r="2.2" fill="#ffd86b"/>
    </g>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="104" fill="url(#bg)" stroke="#06161b" stroke-width="10"/>

  <!-- leaves -->
  <path d="M70 452 C110 360 210 340 300 370 C230 400 150 420 70 452 Z" fill="url(#leaf)" stroke="#0b3b22" stroke-width="5" stroke-linejoin="round"/>
  <path d="M120 470 C200 430 320 430 420 462 C320 476 220 482 120 470 Z" fill="url(#leaf)" stroke="#0b3b22" stroke-width="5" stroke-linejoin="round"/>

  <!-- arching stem -->
  <path d="M170 448 C150 330 210 190 400 100" fill="none" stroke="#0b3b22" stroke-width="13" stroke-linecap="round"/>
  <path d="M170 448 C150 330 210 190 400 100" fill="none" stroke="#6fbf5a" stroke-width="7" stroke-linecap="round"/>

  <!-- buds -->
  <ellipse cx="420" cy="88" rx="13" ry="18" transform="rotate(40 420 88)" fill="#f7b3d8" stroke="#5a0c38" stroke-width="3"/>
  <ellipse cx="448" cy="118" rx="10" ry="14" transform="rotate(70 448 118)" fill="#f48cc4" stroke="#5a0c38" stroke-width="3"/>

  <!-- flowers, largest in front -->
  <use href="#flower" transform="translate(338 150) scale(0.78) rotate(12)"/>
  <use href="#flower" transform="translate(256 238) scale(0.95) rotate(6)"/>
  <use href="#flower" transform="translate(168 340) scale(1.18) rotate(-4)"/>
</svg>
